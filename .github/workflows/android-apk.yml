# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

# START: autonomously generated by an AI Agent (Codex) on request of the repository owner
# Builds the signed Mixxx Android APK for arm64-v8a, Android 13 and later.
# Native minimum API 33; Java compile and target SDK 36.
# END: autonomously generated by an AI Agent (Codex) on request of the repository owner
#
# Why a separate workflow?
#   Upstream's .github/workflows/build.yml can only be started from another
#   workflow (workflow_call) and always builds every platform (Linux, macOS,
#   Windows, Android) at once.  This workflow runs only the Android job with the
#   same steps and cmake arguments as upstream's "Android 15 arm64" matrix
#   entry (plus swap space and a low `--parallel` value, see the "Build APK"
#   step), so it also works on a fork without any repository secrets.
#
# The finished APK is attached to the workflow run as the artifact
# "mixxx-android-apk", see android-build/README.md.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or commit SHA)"
        required: false
        default: ""
        type: string
      development_signing:
        description: "Allow a temporary development certificate if the signing secret is absent"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - android-apk-build
    paths:
      - ".github/workflows/android-apk.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "res/**"
      - "packaging/android/**"
      - "android-build/**"
      - "tools/android_buildenv.sh"

permissions:
  contents: read

env:
  # --- START: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
  # Build trigger for the 'android-apk-build' branch: bump BUILD_TRIGGER and push to start a run.
  # --- END: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
  BUILD_TRIGGER: "2026-10-11.2"
  BUILDENV_BASEPATH: ${{ github.workspace }}/buildenv
  CMAKE_ARGS: >-
    -DBULK=ON
    -DQT6=ON
    -DQML=ON
    -DHID=ON
    -DVCPKG_TARGET_TRIPLET=arm64-android
    -DVCPKG_DEFAULT_HOST_TRIPLET=x64-linux-release
    -DCMAKE_SYSTEM_NAME=Android
    -DBUILD_TESTING=OFF
    -DBUILD_BENCH=OFF

jobs:
  android-apk:
    name: Android 13+ arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          # Required to make `git describe` work (Mixxx version information).
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: "Ensure that all tags are fetched"
        run: git fetch origin --force --tags

      - name: "Test Android components"
        run: python3 -m unittest discover -s android-build/tests -v

      # Remove unused pre-installed software, the Android build needs the disk
      # space (the dependency build environment alone is several GB).
      - name: "[android] Free up disk space"
        run: |
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /home/packer
          sudo rm -rf /opt/az
          sudo rm -rf /opt/google
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/vcpkg
          # --- START: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
          # A GitHub-hosted runner of a private repository has a much smaller
          # disk (72 GB, ~32 GB free) than the one of a public repository
          # (145 GB, ~105 GB free).  Remove the parts of the pre-installed
          # Android SDK that are only needed to run emulators, because the
          # build environment (several GB) plus a RelWithDebInfo build with
          # debug info (several GB more) does not fit otherwise.  The SDK
          # components that Gradle/AGP and androiddeployqt need (platforms,
          # build-tools, platform-tools, cmdline-tools, licenses, ndk) are left
          # untouched, so none of the SDK paths changes.
          # --- END: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/local/lib/android/sdk/sources || true
          sudo rm -rf /usr/local/lib/android/sdk/docs || true
          sudo rm -rf /usr/local/lib/android/sdk/cmake || true
          sudo rm -rf /usr/local/lib/android/sdk/extras || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/Java_* || true
          df -h /

      - name: "[android] Setup signing key"
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          DEVELOPMENT_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.development_signing }}
        run: |
          set -euo pipefail
          python3 android-build/verify-apk.py --check-source-only
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/mixxx.keystore"
          if [ -n "${ANDROID_SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "${ANDROID_SIGNING_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
            KEYSTORE_PASSWORD="${ANDROID_SIGNING_PASSWORD}"
          elif [ "${DEVELOPMENT_SIGNING:-false}" = "true" ]; then
            echo "::notice::Explicit development build: generating a temporary certificate; this APK cannot update a production installation."
            keytool \
              -genkey \
              -keystore "${KEYSTORE_PATH}" \
              -alias mixxx \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -keypass mixxxandroid \
              -storepass mixxxandroid \
              -dname "CN=${GITHUB_ACTOR}"
            KEYSTORE_PASSWORD="mixxxandroid"
          else
            echo "::error::Production builds require ANDROID_SIGNING_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD."
            exit 1
          fi
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=${KEYSTORE_PASSWORD}"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=${KEYSTORE_PASSWORD}"
          } >> "${GITHUB_ENV}"
          keytool -list -keystore "${KEYSTORE_PATH}" -storepass "${KEYSTORE_PASSWORD}"

      # Installs JDK 17, Android SDK platform 35, build-tools 35.0.0 and
      # NDK 27.2.12479018, and exports BUILDENV_URL/BUILDENV_SHA256,
      # MIXXX_VCPKG_ROOT and VCPKG_TARGET_TRIPLET for the following steps.
      # --- START: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
      # The downloads of this step (apt archive plus sdkmanager/NDK) have no read
      # timeout of their own and stalled for over 55 minutes in a previous run.
      # Every attempt is therefore bounded by "timeout" and retried, and the step
      # as a whole is capped so that a stalled mirror fails the build instead of
      # consuming the whole job budget.
      #
      # A later run showed that the in-region mirror (azure.archive.ubuntu.com)
      # can hang while downloading a single package (apt requested one 71 MB
      # file and then made no progress for 40 minutes).  apt is therefore told
      # to retry stalled connections, and starting with the second attempt the
      # mirror is switched to Canonical's main archive, which is not affected by
      # a problem of the in-region mirror.
      # --- END: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
      - name: "Set up build environment"
        timeout-minutes: 45
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -uo pipefail
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::ftp::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-mixxx-apk-retries >/dev/null
          ok=0
          for attempt in 1 2 3; do
            echo "::group::android_buildenv.sh setup - attempt ${attempt}"
            date -u
            if [ "${attempt}" -ge 2 ]; then
              echo "::notice::Retrying with Canonical's main archive instead of the in-region mirror."
              echo "http://archive.ubuntu.com/ubuntu/" \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
              sudo rm -rf /var/lib/apt/lists/* || true
            fi
            if timeout --signal=INT --kill-after=60 780 ./tools/android_buildenv.sh setup; then
              ok=1
              date -u
              echo "::endgroup::"
              break
            fi
            echo "::warning::attempt ${attempt} hit the 13 minute limit - retrying"
            date -u
            echo "::endgroup::"
            sleep 15
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::build environment setup failed after 3 bounded attempts"
            exit 1
          fi

      - name: "Show build environment"
        run: |
          echo "ANDROID_SDK=${ANDROID_SDK}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "MIXXX_VCPKG_ROOT=${MIXXX_VCPKG_ROOT}"
          echo "VCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET}"
          echo "BUILDENV_NAME=${BUILDENV_NAME}"
          # --- START: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
          # Diagnostic output for the steps that follow.  This step always
          # succeeds, so its log stays available even if the build below is
          # killed (e.g. because the runner ran out of disk space).
          # --- END: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
          echo "Memory and disk space before the build:"
          free -h
          df -h /
          echo "Android SDK that Gradle/AGP will use (${ANDROID_SDK_ROOT:-not set}):"
          ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" || true
          ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms" || true
          ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: "Create build directory"
        run: mkdir -p build

      # A GitHub-hosted runner of a private repository only has 7.8 GB of RAM
      # and a 72 GB disk.  Single Mixxx translation units such as
      # soundmanager.cpp or metadatasourcetaglib.cpp need a couple of GB each
      # when compiled with RelWithDebInfo, so a cold build with the default
      # parallelism gets killed by the OOM killer (the job ends as "cancelled"
      # with "The runner has received a shutdown signal" while every gmake
      # child reports "Terminated").  The runner image already ships a small
      # /swapfile which is in use, so `fallocate /swapfile` fails with "Text
      # file busy" - add an additional 3 GB next to it instead.  The disk space
      # is required by the build itself, so the swap file is kept as small as
      # possible and the "Build APK" step below builds one file at a time,
      # exactly like upstream's .github/workflows/build.yml.
      - name: "[android] Add swap space"
        run: |
          echo "Memory before:"; free -h; sudo swapon --show || true
          SWAPFILE=/home/runner/mixxx-swapfile
          if sudo dd if=/dev/zero of="${SWAPFILE}" bs=1M count=3072 status=none \
             && sudo chmod 600 "${SWAPFILE}" \
             && sudo mkswap "${SWAPFILE}" \
             && sudo swapon "${SWAPFILE}"; then
            echo "::notice::Added 8 GB of swap space"
          else
            echo "::warning::Could not add swap space - the build may run out of memory."
          fi
          echo "Memory after:"; free -h; sudo swapon --show || true
          df -h /

      # --- START: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
      # CMake downloads the dependency build environment without checking
      # whether the transfer completed, and its SHA256 check then fails for a
      # truncated file.  That happened in a previous run: the download stopped
      # at 4% and the configure step below aborted with a checksum mismatch.
      # Download and verify the archive here with retries instead, so that the
      # configure step finds the valid file and skips its own download.
      # --- END: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
      - name: "[android] Download build environment"
        run: |
          set -euo pipefail
          mkdir -p "${BUILDENV_BASEPATH}"
          ZIP="${BUILDENV_BASEPATH}/${BUILDENV_NAME}.zip"
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: downloading $(basename "${ZIP}") ..."
            if curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 \
                 --continue-at - --output "${ZIP}" "${BUILDENV_URL}"; then
              if echo "${BUILDENV_SHA256}  ${ZIP}" | sha256sum --check --status; then
                echo "::notice::Downloaded and verified $(basename "${ZIP}")"
                sha256sum "${ZIP}"
                df -h /
                exit 0
              fi
              echo "::warning::SHA256 mismatch - the download was incomplete."
            else
              echo "::warning::Download failed."
            fi
            rm -f "${ZIP}"
            sleep $((attempt * 15))
          done
          echo "::error::Could not download and verify the build environment archive."
          exit 1

      # Verifies the SHA256 of the build environment archive downloaded above.
      #
      # --- START: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
      # The debug information of a RelWithDebInfo build is what needs most of
      # the disk space (the object files alone are several GB) and the
      # GitHub-hosted runner of a private repository only has a 72 GB disk.
      # Keep the RelWithDebInfo configuration and its optimization flags, but
      # disable the debug information with -g0, which also lowers the memory
      # needed by the linker.  The APK is stripped by androiddeployqt anyway.
      # These two arguments are spelled out here instead of being added to
      # CMAKE_ARGS, because their values contain spaces which a shell variable
      # expansion would split into separate arguments.
      # --- END: autonomously generated by an AI Agent (Cline) on request of the repository owner ---
      - name: "Configure"
        timeout-minutes: 45
        working-directory: build
        run: >
          cmake
          -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          ${CMAKE_ARGS}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDEBUG_ASSERTIONS_FATAL=OFF
          "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG"
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG"
          ..

      - name: "Test browse, input ownership and routing with host Qt"
        env:
          PROFUZE_HOST_QT: ${{ env.MIXXX_VCPKG_ROOT }}/installed/x64-linux-release
        run: |
          python3 -m unittest discover -s android-build/tests -p test_runtime_qt.py -v
          python3 -m unittest discover -s android-build/tests -p test_controller_android_qt.py -v
          python3 -m unittest discover -s android-build/tests -p test_controller_reconfiguration_qt.py -v

      - name: "Install host Qt GUI test dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl-dev libx11-dev libsm-dev libice-dev libxkbcommon-dev

      - name: "Validate admitted mappings and replay every MIDI profile"
        env:
          PROFUZE_HOST_QT: ${{ env.MIXXX_VCPKG_ROOT }}/installed/x64-linux-release
        run: |
          python3 -m unittest discover -s android-build/tests -p test_mapping_runtime_qt.py -v
          python3 -m unittest discover -s android-build/tests -p test_midi_profile_simulation.py -v

      - name: "Test native waveform touch routing with host Qt"
        env:
          PROFUZE_HOST_QT_GUI: ${{ env.MIXXX_VCPKG_ROOT }}/installed/x64-linux-release
        run: |
          python3 -m unittest discover -s android-build/tests -p test_waveform_touch_qt.py -v
          python3 -m unittest discover -s android-build/tests -p test_controller_chooser_qt.py -v

      # The dependency build environment is downloaded and unpacked by the
      # configure step above (see BUILDENV_URL/BUILDENV_BASEPATH in
      # CMakeLists.txt) and the archive is not needed anymore afterwards.
      # Removing it frees a couple of GB of disk space, which the RelWithDebInfo
      # build below needs on the small disk of a private repository runner.
      - name: "[android] Free up disk space (build environment archive)"
        run: |
          rm -f "${BUILDENV_BASEPATH}"/*.zip || true
          df -h /

      # The `apk` target is the only one that works reliably: targets such as
      # mixxx-test are currently broken due to library conflicts (OpenMP).
      #
      # Upstream's .github/workflows/build.yml builds without `--parallel`, i.e.
      # one file at a time.  The runner has only 7.8 GB of RAM, so the same
      # sequential build is used here - it is a bit slower, but it compiles two
      # heavy translation units at the same time only with a large swap file,
      # which does not fit on the small disk of a private repository runner.
      - name: "Rebuild Zix for Android 13+"
        timeout-minutes: 10
        run: |
          python3 android-build/rebuild-zix-api33.py \
            --ndk "${ANDROID_NDK_HOME}" \
            --vcpkg-root "${MIXXX_VCPKG_ROOT}" \
            --triplet "${VCPKG_TARGET_TRIPLET}" \
            --work-dir "${GITHUB_WORKSPACE}/build/zix-api33"

      - name: "Repair Android PortAudio lifecycle"
        timeout-minutes: 10
        run: |
          python3 android-build/rebuild-portaudio-android.py \
            --ndk "${ANDROID_NDK_HOME}" \
            --vcpkg-root "${MIXXX_VCPKG_ROOT}" \
            --triplet "${VCPKG_TARGET_TRIPLET}" \
            --work-dir "${GITHUB_WORKSPACE}/build/portaudio-android"

      - name: "Rebuild Qt Core for Android 13+"
        timeout-minutes: 45
        run: |
          python3 android-build/rebuild-qtcore-api33.py \
            --ndk "${ANDROID_NDK_HOME}" \
            --sdk "${ANDROID_SDK}" \
            --vcpkg-root "${MIXXX_VCPKG_ROOT}" \
            --triplet "${VCPKG_TARGET_TRIPLET}" \
            --work-dir "${GITHUB_WORKSPACE}/build/qtcore-api33"

      - name: "Build APK"
        timeout-minutes: 150
        working-directory: build
        run: cmake --build . --target apk --parallel 1

      - name: "Show built APK"
        run: ls -la build/android-build/build/outputs/apk/release/

      - name: "Verify Android 13+ package compatibility"
        env:
          DEVELOPMENT_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.development_signing }}
        run: |
          set -euo pipefail
          verification_flags=()
          if [ "${DEVELOPMENT_SIGNING:-false}" = "true" ]; then
            verification_flags+=(--development)
          fi
          for apk in build/android-build/build/outputs/apk/release/*.apk; do
            python3 android-build/verify-apk.py "$apk" \
              --build-tools "${ANDROID_SDK}/build-tools/36.0.0" \
              --ndk "${ANDROID_NDK_HOME}" "${verification_flags[@]}"
          done

      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: mixxx-android-apk
          path: build/android-build/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

